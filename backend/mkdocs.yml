site_name: Image Analysis
site_author: ""
copyright: ""

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: true
            members_order: alphabetical
            filters: []
  - with-pdf:
      enabled: true
      output_path: pdf/image-analysis_documentation.pdf
      cover: true
      cover_title: "Image Analysis - Documentation"
      cover_subtitle: ""
      author: ""
      copyright: "© 2026 Image Analysis"