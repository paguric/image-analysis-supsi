[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=16.1.0",
    "fastapi[standard]>=0.136.1",
    "pywebview[pyside6]",
    "uvicorn",
    "matplotlib>=3.10.8",
    "moviepy>=1.0.3",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "scipy>=1.17.1",
    "sqlmodel>=0.0.37",
    "starlette>=0.52.1",
    "pytest>=9.0.2",
    "pytest-order>=1.3.0",
]

[dependency-groups]
dev = [
    "pyinstaller",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-with-pdf",
]


[tool.pytest.ini_options]
pythonpath = [
  "."
]
